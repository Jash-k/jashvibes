name: CI

# Every push and PR runs the same gates the repo already ships:
# the player-scoped ESLint, the 350+ logic tests, and a production build.
# The build runs with no secrets on purpose — the app is designed so the
# shell builds without DB/TMDB (secrets are runtime-only), and that
# property is worth pinning in CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (reproducible, from lockfile)
        run: npm ci

      - name: Lint (player + live + tests scope)
        run: npm run lint:player

      - name: Test
        run: npm run test

      - name: Build (no env secrets — shell must build bare)
        run: npm run build
